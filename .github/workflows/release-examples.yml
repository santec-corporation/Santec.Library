name: "Release the examples"

# The internal repository mirrors a release here and pushes its tag. This
# workflow turns that tag into a GitHub release whose assets are one archive per
# example, so a reader downloads just the sample they want instead of the whole
# repository. The tag push is the normal path; workflow_dispatch rebuilds the
# assets of a tag that is already here (the mirror does not push a tag twice).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, e.g. v1.8.0.2'
        required: true
        type: string

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  release:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    # On a tag push the tag is the release. A dispatch names it, and the tree it
    # checks out has to be that release: the manifest version names the archives,
    # so a mismatch would publish one version's files under another version's tag.
    - name: Resolve the version
      id: version
      run: |
        $tag = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { '${{ inputs.tag }}' }
        if (-not $tag) { throw 'No tag: run this workflow from a tag, or pass the tag input.' }
        if ($tag -notmatch '^v\d+(\.\d+){1,3}(?:\+[0-9A-Za-z][0-9A-Za-z.-]*)?$') { throw "Not a release tag: $tag" }
        $version = $tag -replace '^v'
        $manifest = (Get-Content lib/win-x64/versions.json -Raw | ConvertFrom-Json).version
        if ($manifest -ne $version) { throw "the checkout carries $manifest, not $version; check out the release tag." }
        "tag=$tag" >> $env:GITHUB_OUTPUT
        "version=$version" >> $env:GITHUB_OUTPUT

    - name: Package the examples
      run: |
        python tools/package_examples.py --version ${{ steps.version.outputs.version }} --output dist
        if (-not (Get-ChildItem dist -Filter *.zip)) { throw 'no archives were written' }

    # This workflow packages the SDK too: one archive for each platform directory in
    # lib/, laid out as lib/<platform>, include and python.
    - name: Package the SDK
      run: |
        $ErrorActionPreference = 'Stop'
        $version = '${{ steps.version.outputs.version }}'
        New-Item -ItemType Directory -Force -Path dist | Out-Null

        foreach ($platform in Get-ChildItem lib -Directory) {
          $rid = $platform.Name
          if (-not (Test-Path "lib/$rid/versions.json")) { continue }

          $stage = "sdk/Santec.Library-$version-$rid"
          New-Item -ItemType Directory -Force -Path "$stage/lib", "$stage/include" | Out-Null
          Copy-Item "lib/$rid" "$stage/lib/$rid" -Recurse
          Copy-Item include/* "$stage/include" -Recurse
          Copy-Item python "$stage/python" -Recurse
          Get-ChildItem "$stage/python" -Recurse -Directory -Filter '__pycache__' |
            Remove-Item -Recurse -Force

          $binary = if ($rid -like 'win*') { 'Santec.Library.dll' } else { 'Santec.Library.so' }
          $title = "Santec.Library $version ($rid)"
          $lines = @(
            $title,
            ('=' * $title.Length),
            '',
            "lib/$rid/$binary   the native library; copy it next to your application"
          )
          if ($rid -like 'win*') {
            $lines += "lib/$rid/Santec.Library.lib   MSVC import library, for C++ callers"
          }
          $lines += @(
            "lib/$rid/LICENSE.txt    the terms this binary is licensed under",
            "lib/$rid/versions.json   version, ABI version, build commit, supported OS, file hashes",
            'include/SantecLibrary.h     C declarations',
            'include/SantecLibrary.hpp   C++ declarations',
            'python/                     the Python package, the examples and the FlatBuffers bindings',
            '',
            "The Python examples load the native library with ctypes: keep lib/$rid beside",
            'the script, or pass --dll <path>.'
          )
          $lines -join "`n" | Set-Content -Encoding utf8 "$stage/README.txt"

          Compress-Archive -Path "$stage/*" -DestinationPath "dist/Santec.Library-$version-$rid.zip" -Force
        }

        if (-not (Get-ChildItem dist -Filter 'Santec.Library-*-x64.zip')) {
          throw 'no SDK archive was written: the checkout carries no lib/<platform>/versions.json'
        }

    # One archive per example, named Santec.Library-<version>-<example>.zip, beside one
    # SDK archive per platform. This workflow creates the release on the first run and
    # replaces its assets on a re-run.
    - name: Publish the release
      uses: softprops/action-gh-release@v3
      with:
        name: Santec.Library ${{ steps.version.outputs.version }}
        tag_name: ${{ steps.version.outputs.tag }}
        target_commitish: ${{ github.sha }}
        # A +label is build metadata, which semver does not treat as a prerelease, so
        # GitHub needs the flag to keep the plain version as the latest release.
        prerelease: ${{ contains(steps.version.outputs.tag, '+') }}
        generate_release_notes: true
        files: dist/*.zip
